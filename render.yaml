services:
  - type: web
    name: 21reservation-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGO
        value: HS256
      - key: JWT_EXPIRE_MIN
        value: "1440"
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: AGENCY_ADMIN_EMAIL
        sync: false
      - key: AGENCY_ADMIN_PASSWORD
        sync: false
      - key: SEED_ENABLED
        value: "false"
      - key: EMAIL_FROM
        value: ""
      - key: RESEND_API_KEY
        value: ""
      - key: STRIPE_SECRET_KEY
        value: ""
      - key: STRIPE_WEBHOOK_SECRET
        value: ""
      - key: WEBHOOK_CRON_SECRET
        value: ""
      - key: RUN_REPAIR_ON_BOOT
        value: "false"

  - type: static_site
    name: 21reservation-frontend
    staticPublishPath: frontend/build
    buildCommand: cd frontend && npm install && npm run build
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: cross-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: unsafe-none
