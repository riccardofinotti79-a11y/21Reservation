name: claude

# Agente di sviluppo. Parte solo quando Riccardo (o Jarvis con il suo token) scrive
# @claude in un'issue o in un commento. Il repo e pubblico: chiunque altro viene ignorato.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')
        && github.event.issue.author_association == 'OWNER') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude')
        && github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 50
            --allowedTools "Bash(cd:*),Bash(python:*),Bash(pip install:*),Bash(npm ci:*),Bash(npm install:*),Bash(npm run build:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "Progetto 21Reservation: backend FastAPI in backend/, frontend React (craco) in frontend/, deploy su Render. Scrivi commenti e messaggi in italiano. Modifiche piccole e mirate, mai su main. Prima di finire esegui gli stessi controlli di .github/workflows/ci.yml (compileall e import del backend con le variabili finte, npm run build con CI=false). Mai chiavi, password o dati personali nel codice: le credenziali stanno nelle variabili d'ambiente di Render. Il repo e pubblico."
